<!--
  DLSS Pagination Component — split large datasets into manageable pages.

  Unlike the singleton components (modal, notification, loader), a page
  can have several independent pagination bars at once (a cases table
  *and* a documents list, say), so this isn't rendered once into a fixed
  slot — instead it's a small factory: `DLSS.Pagination.create()` clones
  the <template> below into whatever container you give it, and returns
  a controller you drive from your own fetch/render logic.

  Usage: include this fragment once per page (e.g.
  `<div data-include="pagination"></div>` right before the closing
  `</body>`) alongside css/pagination.css, then:

    const pager = DLSS.Pagination.create(document.getElementById('casesPagination'), {
      totalItems: 248,
      pageSize: 10,               // default 10
      currentPage: 1,             // default 1
      pageSizeOptions: [10, 25, 50, 100],
      itemLabel: 'cases',         // used in the "Showing 1-10 of 248 cases" summary
      onChange({ page, pageSize }) {
        // fetch page `page` at `pageSize` per page and re-render your list,
        // e.g.: loadCases({ page, pageSize }).then((res) => {
        //   renderCaseRows(res.rows);
        //   pager.update({ totalItems: res.total });   // resync if the
        // });                                          // total changed
      },
    });

  The container becomes the pagination bar itself (typically the
  `data-page-size-slot`... i.e. just drop it inside a `.table-footer`
  (tables.css) below a table, or anywhere a long list needs paging).
  Numbered pages collapse to a compact "Page X of Y" label on mobile
  (see responsive.css) and use smart ellipsis (1 … 4 5 6 … 20) once the
  page count is large, so the bar never gets unwieldy.

  See js/app.js's "PAGINATION LIBRARY" section for the full API,
  including `pager.update({ totalItems, currentPage, pageSize })`,
  `pager.getState()`, and `pager.destroy()`.
-->
<div id="paginationRoot" data-component="pagination">
  <template id="paginationTemplate">
    <nav class="pagination" aria-label="Pagination">
      <p class="pagination-summary"></p>

      <div class="pagination-controls">
        <button type="button" class="pagination-btn" data-page-prev aria-label="Previous page">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 15 7.5 10l5-5"/></svg>
          <span class="hidden-mobile">Prev</span>
        </button>

        <span class="pagination-compact-label"></span>

        <ul class="pagination-list" role="list"></ul>

        <button type="button" class="pagination-btn" data-page-next aria-label="Next page">
          <span class="hidden-mobile">Next</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5 12.5 10l-5 5"/></svg>
        </button>
      </div>

      <div class="pagination-size">
        <span aria-hidden="true">Show</span>
        <select class="form-select form-control-sm pagination-size-select" data-page-size aria-label="Results per page"></select>
        <span aria-hidden="true">per page</span>
      </div>
    </nav>
  </template>
</div>
